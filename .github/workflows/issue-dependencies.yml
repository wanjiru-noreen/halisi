name: Issue & PR Dependencies

on:
  issues:
    types: [opened, edited, closed, reopened]
  pull_request_target:
    types: [opened, edited, synchronize, reopened]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      sweep:
        description: 'Run full repository sweep on all open issues'
        required: false
        type: boolean
        default: false

permissions:
  issues: write
  pull-requests: write
  contents: read

concurrency:
  group: dependencies-${{ github.event_name }}-${{ github.event.issue.number || github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  dependencies:
    name: Manage Issue & PR Dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run unit tests for dependency manager
        run: python3 .github/scripts/test_issue_dependencies.py

      - name: Evaluate Issue / PR Dependencies
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.sweep }}" = "true" ]; then
            python3 .github/scripts/manage_issue_dependencies.py --sweep
          else
            python3 .github/scripts/manage_issue_dependencies.py
          fi
