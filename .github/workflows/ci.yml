name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Go checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: halisi_test
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: halisi_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U halisi_test -d halisi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
    steps:
      - name: Check out code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up sqlc
        uses: sqlc-dev/setup-sqlc@bac53b7fb28c039a6c7f5736fd1e89744021bdd6 # v5
        with:
          sqlc-version: '1.31.1'
      - name: Download dependencies
        run: go mod download
      - name: Verify generated sqlc code
        run: |
          sqlc generate
          if [ -n "$(git status --porcelain --untracked-files=all -- internal/database/sqlc)" ]; then
            git diff -- internal/database/sqlc
            echo "Generated sqlc files are out of date. Run sqlc generate and commit all generated changes."
            exit 1
          fi
      - name: Build
        run: go build ./...
      - name: Test with PostgreSQL
        env:
          DATABASE_URL: postgres://halisi_test:ci_only_password@localhost:${{ job.services.postgres.ports['5432'] }}/halisi_test?sslmode=disable
          TEST_DATABASE_URL: postgres://halisi_test:ci_only_password@localhost:${{ job.services.postgres.ports['5432'] }}/halisi_test?sslmode=disable
          TEST_MIGRATION_DATABASE_URL: postgres://halisi_test:ci_only_password@localhost:${{ job.services.postgres.ports['5432'] }}/halisi_test?sslmode=disable
        run: go test ./... -count=1
      - name: Vet
        run: go vet ./...
