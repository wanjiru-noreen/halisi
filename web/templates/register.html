<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Halisi</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>

<div class="auth-page">

    <div class="auth-card">

        <div class="auth-brand">
            <span class="auth-logo">🔥</span>

            <div>
                <h1>HALISI</h1>
                <p>Get gas delivered safely and fast.</p>
            </div>
        </div>

        <div class="auth-header">
            <h2>Create your account</h2>
            <p>Join Halisi and order gas from verified shops in your area.</p>
        </div>

        <form action="/register" method="POST" class="auth-form">

            <label for="name">Full Name</label>
            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your full name"
                required
            >

            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Create a password"
                required
            >

            <label for="role">Account Type</label>
            <select id="role" name="role" required onchange="toggleShopFields()">
                <option value="customer">Customer</option>
                <option value="owner">Shop Owner</option>
            </select>

            <div id="shop-fields" style="display: none;">

                <label for="shop_name">Shop Name</label>
                <input
                    type="text"
                    id="shop_name"
                    name="shop_name"
                    placeholder="Enter your shop name"
                >

                <label for="location">Shop Location</label>
                <input
                    type="text"
                    id="location"
                    name="location"
                    placeholder="Enter your shop location"
                >

                <label for="phone">Shop Phone Number</label>
                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="Enter your shop phone number"
                >

            </div>

            <button type="submit" class="btn btn-primary">
                Register
            </button>

        </form>

        <p class="auth-footer">
            Already have an account?
            <a href="/login">Login</a>
        </p>

        <p class="auth-back">
            <a href="/">← Back Home</a>
        </p>

    </div>

</div>

<script>
function toggleShopFields() {
    const role = document.getElementById("role").value;
    const shopFields = document.getElementById("shop-fields");

    if (role === "owner") {
        shopFields.style.display = "block";

        document.getElementById("shop_name").required = true;
        document.getElementById("location").required = true;
        document.getElementById("phone").required = true;
    } else {
        shopFields.style.display = "none";

        document.getElementById("shop_name").required = false;
        document.getElementById("location").required = false;
        document.getElementById("phone").required = false;
    }
}
</script>

</body>
</html>
