<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Place Order | Halisi</title>

    <link rel="stylesheet" href="/static/css/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

<header class="navbar">

    <div class="logo">HALISI</div>

    <nav>

        <a href="/dashboard">Home</a>
        <a href="/shops">Find Shop</a>
        <a href="/orders">My Orders</a>
        <a href="/logout">Logout</a>

    </nav>

</header>

<main>

<section class="order-container">

    <h1>Complete Your Order</h1>

    <p>
        Fill in the details below and we'll handle the rest.
    </p>

    <form action="/order" method="POST">

        <label>Select Shop</label>

        <select name="shop_id" required>

            {{range .}}

            <option value="{{.ID}}">
                {{.Name}}
            </option>

            {{end}}

        </select>

        <label>Cylinder Size</label>

        <select name="cylinder_size" required>

            <option value="6kg">6 KG</option>

            <option value="13kg">13 KG</option>

        </select>

        <label>Quantity</label>

        <input
            type="number"
            name="quantity"
            min="1"
            value="1"
            required
        >

        <label>Delivery Address</label>

        <input
            type="text"
            name="address"
            placeholder="Enter your location"
            required
        >

        <label>Phone Number</label>

        <input
            type="text"
            name="phone"
            placeholder="07XXXXXXXX"
            required
        >

        <button type="submit">
            Confirm Order
        </button>

    </form>

</section>

</main>

<footer>

<p>© 2026 Halisi. All Rights Reserved.</p>

</footer>

</body>
</html>
