<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HALISI - Complete Your Order</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

  <!-- Navbar -->
  {{template "navbar.html" .}}

  <main class="container">
    <div class="page-header">
      <h2>Complete Your Order</h2>
      <p>Fill in the details below and we'll handle the rest.</p>
    </div>

    <div class="card form-card">
      <form action="/order" method="POST" class="order-form">
        <div class="form-grid">
          
          <div class="form-group">
            <label for="shop">Select Shop</label>
            <select id="shop" name="shop_id" class="input-field" required>
              <option value="1">Shell Gas - Kisumu CBD</option>
              <option value="2">Rubis Gas - Kondele</option>
              <option value="3">TotalEnergies - Milimani</option>
            </select>
          </div>

          <div class="form-group">
            <label for="cylinder">Cylinder Size</label>
            <select id="cylinder" name="cylinder_size" class="input-field" required>
              <option value="6kg">6 KG</option>
              <option value="13kg">13 KG</option>
              <option value="45kg">45 KG</option>
            </select>
          </div>

          <div class="form-group">
            <label for="quantity">Quantity</label>
            <input type="number" id="quantity" name="quantity" value="1" min="1" class="input-field" required>
          </div>

          <div class="form-group">
            <label for="address">Delivery Address</label>
            <input type="text" id="address" name="address" placeholder="Enter your location (e.g. Milimani, House #4)" class="input-field" required>
          </div>

          <div class="form-group full-width">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone" placeholder="07XXXXXXXX" class="input-field" required>
          </div>

        </div>

        <button type="submit" class="btn btn-primary btn-block">Confirm Order</button>
      </form>
    </div>
  </main>

  <footer class="site-footer">
    <p>© 2026 Halisi. All Rights Reserved.</p>
  </footer>

</body>
</html>
