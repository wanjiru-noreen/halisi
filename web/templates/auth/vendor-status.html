<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Business verification · HALISI</title><link rel="stylesheet" href="/static/css/auth.css"><script src="/static/js/vendor.js" defer></script></head>
<body class="bg-stone-50 text-stone-900" data-vendor-page="status"><main class="mx-auto max-w-3xl px-6 py-10"><a href="/dashboard" class="text-2xl font-black text-emerald-800">HALISI.</a><section class="mt-10 rounded-3xl border border-stone-200 bg-white p-8"><h1 class="text-3xl font-semibold">Your business verification</h1><p id="status" class="mt-5 font-semibold text-emerald-800">Loading application…</p><p id="reason" class="mt-3 text-stone-600"></p><p id="error" class="mt-5 text-red-700" role="alert" hidden></p><a href="/vendor/register" class="my-5 block text-sm text-emerald-800 underline">Edit business information</a>
<p class="text-sm text-stone-600">Documents stay private. Upload PDF, JPEG or PNG files up to 5 MiB each. Replacing a document resets your application for review.</p><div id="documents" class="my-6 space-y-3"></div>
<form class="upload-form my-6 space-y-3" data-type="business_registration"><label class="block font-medium">Business registration<input class="field mt-2" type="file" name="document" accept=".pdf,.jpg,.jpeg,.png" required></label><button class="text-sm font-semibold text-emerald-800 underline">Upload registration document</button></form>
<form class="upload-form my-6 space-y-3" data-type="lpg_license"><label class="block font-medium">Applicable LPG licensing document<input class="field mt-2" type="file" name="document" accept=".pdf,.jpg,.jpeg,.png" required></label><button class="text-sm font-semibold text-emerald-800 underline">Upload licensing document</button></form>
<button id="submit-application" class="button-primary">Submit for administrator review</button></section></main></body></html>
