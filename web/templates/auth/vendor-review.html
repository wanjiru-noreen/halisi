<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Review businesses · HALISI</title><link rel="stylesheet" href="/static/css/auth.css"><script src="/static/js/vendor.js" defer></script></head>
<body class="bg-stone-50 text-stone-900" data-vendor-page="review"><main class="mx-auto max-w-5xl px-6 py-10"><a href="/admin/dashboard" class="text-2xl font-black text-emerald-800">HALISI.</a><h1 class="my-8 text-3xl font-semibold">Vendor verification</h1><p class="text-stone-600">Review the submitted business details and both documents before approving. Rejections and suspensions require a reason.</p><p id="error" class="my-5 text-red-700" role="alert" hidden></p><nav class="my-5 flex items-center gap-4" aria-label="Application pages"><button id="applications-previous" type="button" class="rounded-xl border border-stone-300 px-4 py-2 text-sm" disabled>Previous</button><span id="applications-page" class="text-sm" aria-live="polite"></span><button id="applications-next" type="button" class="rounded-xl border border-stone-300 px-4 py-2 text-sm" disabled>Next</button></nav><div id="applications" class="my-6 flex flex-wrap gap-3"></div>
<section id="review-panel" class="rounded-3xl border border-stone-200 bg-white p-8" hidden><h2 id="business-name" class="text-2xl font-semibold"></h2><pre id="business-details" class="my-5 whitespace-pre-wrap text-sm text-stone-600"></pre><div id="documents" class="space-y-3"></div><form id="review-form" class="mt-6 space-y-4"><label class="block font-medium">Decision<select name="status" class="field mt-2"><option value="approved">Approve</option><option value="rejected">Reject</option><option value="suspended">Suspend an approved vendor</option><option value="pending">Lift suspension for resubmission</option></select></label><label class="block font-medium">Review reason<textarea name="reason" class="field mt-2" minlength="3" maxlength="1000" required></textarea></label><button class="button-primary">Record decision</button></form></section></main></body></html>
