<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gas Shops | Halisi</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<header>
    <h1>Available Gas Shops</h1>
    <p>Choose a trusted gas supplier near you</p>
</header>

<main>

    {{if .}}

        {{range .}}

        <div class="shop-card">
            <h2>{{.Name}}</h2>

            <p><strong>Location:</strong> {{.Location}}</p>

            <p><strong>Phone:</strong> {{.Phone}}</p>

            <a href="/shop">View Shop</a>

            <hr>

        </div>

        {{end}}

    {{else}}

        <h2>No shops available.</h2>

    {{end}}

    <br>

    <a href="/dashboard">← Back to Dashboard</a>

</main>

</body>
</html>
