<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HALISI | Login</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body class="auth-body">

<div class="auth-container">
    <div class="auth-card">

        <div class="auth-header">
            <a href="/" class="logo">
                <span class="logo-icon">🔥</span>
                <span>HALISI</span>
            </a>

            <h2>Welcome back</h2>
            <p>Sign in to continue ordering safe and reliable gas delivery.</p>
        </div>

        <!-- Email and password login -->
        <form action="/login" method="POST" class="auth-form">

            <div class="form-group">
                <label for="email">Email address</label>

                <div class="input-with-icon">
                    <i class="fa-solid fa-envelope"></i>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>

                <div class="input-with-icon">
                    <i class="fa-solid fa-lock"></i>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-full">
                Sign In
            </button>
        </form>

        <!-- Divider -->
        <div class="auth-divider">
            <span>OR</span>
        </div>

        <!-- Google sign-in -->
        <a href="/auth/google" class="google-btn">
            <img
                src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
                alt=""
                width="20"
                height="20"
            >
            <span>Continue with Google</span>
        </a>

        <!-- Registration link -->
        <div class="auth-footer">
            <p>Don't have an account? <a href="/register">Register</a></p>
        </div>

    </div>
</div>

<style>
.auth-body {
    background: radial-gradient(
        circle at 20% 30%,
        #2e1065 0%,
        #171138 60%,
        #0f0c24 100%
    );
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Poppins', sans-serif;
    color: #1e293b;
    margin: 0;
}

.auth-container {
    width: 100%;
    max-width: 440px;
    padding: 20px;
    box-sizing: border-box;
}

.auth-card {
    background: white;
    padding: 40px 32px;
    border-radius: 24px;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
    border: 1px solid rgba(255, 255, 255, 0.1);
}

.auth-header {
    text-align: center;
    margin-bottom: 30px;
}

.auth-header .logo {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    text-decoration: none;
    color: #0f172a;
    font-weight: 700;
    font-size: 1.5rem;
    margin-bottom: 16px;
}

.auth-header h2 {
    font-size: 1.5rem;
    font-weight: 700;
    color: #0f172a;
    margin-bottom: 6px;
}

.auth-header p {
    color: #64748b;
    font-size: 0.85rem;
}

.form-group {
    margin-bottom: 20px;
}

.form-group label {
    display: block;
    font-size: 0.85rem;
    font-weight: 600;
    color: #334155;
    margin-bottom: 8px;
}

.input-with-icon {
    position: relative;
    display: flex;
    align-items: center;
}

.input-with-icon i {
    position: absolute;
    left: 14px;
    color: #94a3b8;
    font-size: 0.9rem;
}

.input-with-icon input {
    width: 100%;
    padding: 12px 14px 12px 42px;
    border: 1px solid #cbd5e1;
    border-radius: 12px;
    font-size: 0.95rem;
    font-family: 'Poppins', sans-serif;
    outline: none;
    transition: 0.2s ease;
    background: #f8fafc;
    box-sizing: border-box;
}

.input-with-icon input:focus {
    border-color: var(--primary, #4f46e5);
    background: white;
    box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
}

.btn-full {
    width: 100%;
    padding: 12px;
    background: var(--primary, #4f46e5);
    color: white;
    border: none;
    border-radius: 12px;
    font-weight: 600;
    font-size: 0.95rem;
    cursor: pointer;
    transition: 0.2s ease;
    margin-top: 10px;
    font-family: 'Poppins', sans-serif;
}

.btn-full:hover {
    background: #4338ca;
    transform: translateY(-1px);
}

.auth-divider {
    display: flex;
    align-items: center;
    gap: 14px;
    margin: 22px 0;
    color: #94a3b8;
    font-size: 0.8rem;
}

.auth-divider::before,
.auth-divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: #e2e8f0;
}

.google-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    width: 100%;
    padding: 12px;
    border: 1px solid #cbd5e1;
    border-radius: 12px;
    background: white;
    color: #334155;
    font-family: 'Poppins', sans-serif;
    font-size: 0.9rem;
    font-weight: 500;
    text-decoration: none;
    transition: background 0.2s ease;
    box-sizing: border-box;
}

.google-btn:hover {
    background: #f8fafc;
}

.auth-footer {
    text-align: center;
    margin-top: 24px;
    font-size: 0.85rem;
    color: #64748b;
}

.auth-footer a {
    color: var(--primary, #4f46e5);
    text-decoration: none;
    font-weight: 600;
}

.auth-footer a:hover {
    text-decoration: underline;
}

@media (max-width: 480px) {
    .auth-card {
        padding: 32px 22px;
    }
}
</style>

</body>
</html>
