<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Halisi</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Main stylesheet -->
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>

<div class="auth-page">

    <!-- Minimal authentication navbar -->
    <header class="auth-navbar">

        <!-- Halisi logo -->
        <a href="/" class="auth-logo-link">
            <span class="auth-logo">🔥</span>
            <span class="auth-logo-text">HALISI</span>
        </a>

        <!-- Authentication navigation -->
        <div class="auth-nav-links">
            <a href="/login" class="active">Login</a>
            <a href="/register">Register</a>
        </div>

    </header>

    <!-- Login card -->
    <div class="auth-card">

        <!-- Auth branding -->
        <div class="auth-header">
            <h1>HALISI</h1>
            <p>Gas refill, made simpler.</p>
        </div>

        <!-- Login heading -->
        <div class="auth-header">
            <h2>Welcome back</h2>
            <p>Sign in to continue ordering safe and reliable gas delivery.</p>
        </div>

        <!-- Login form -->
        <form action="/login" method="POST" class="auth-form">

            <!-- Email field -->
            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            <!-- Password field -->
            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
            >

            <!-- Login button -->
            <button type="submit" class="btn btn-primary">
                Login
            </button>

        </form>

        <!-- Register link -->
        <p class="auth-footer">
            Don't have an account?
            <a href="/register">Register</a>
        </p>

    </div>

</div>

</body>
</html>
