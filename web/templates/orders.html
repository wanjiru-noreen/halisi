<div class="status-tracker">

    <div class="status-step {{if or (eq .Status "Pending") (eq .Status "Accepted") (eq .Status "Preparing") (eq .Status "Out for Delivery") (eq .Status "Delivered")}}active{{end}}">
        <span>1</span>
        <p>Pending</p>
    </div>

    <div class="status-step {{if or (eq .Status "Accepted") (eq .Status "Preparing") (eq .Status "Out for Delivery") (eq .Status "Delivered")}}active{{end}}">
        <span>2</span>
        <p>Accepted</p>
    </div>

    <div class="status-step {{if or (eq .Status "Preparing") (eq .Status "Out for Delivery") (eq .Status "Delivered")}}active{{end}}">
        <span>3</span>
        <p>Preparing</p>
    </div>

    <div class="status-step {{if or (eq .Status "Out for Delivery") (eq .Status "Delivered")}}active{{end}}">
        <span>4</span>
        <p>Out for Delivery</p>
    </div>

    <div class="status-step {{if eq .Status "Delivered"}}active{{end}}">
        <span>5</span>
        <p>Delivered</p>
    </div>

</div>
