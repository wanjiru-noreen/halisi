<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Order details · HALISI</title>
  <link rel="stylesheet" href="/static/css/auth.css">
  <script src="/static/js/order-detail.js" defer></script>
</head>
<body class="min-h-screen bg-stone-50 text-stone-900 antialiased">
<header class="border-b border-stone-200 bg-white"><nav class="mx-auto flex max-w-7xl items-center justify-between px-5 py-4 sm:px-8" aria-label="Account navigation"><a href="/" class="text-xl font-black tracking-[0.18em] text-emerald-900">HALISI<span class="text-orange-500">.</span></a><div class="flex gap-3"><a href="/customer/orders" class="rounded-full px-4 py-2 text-sm font-semibold text-emerald-800 hover:bg-emerald-50">All orders</a><a href="/customer/dashboard" class="rounded-full px-4 py-2 text-sm font-semibold text-emerald-800 hover:bg-emerald-50">My account</a></div></nav></header>
<main class="mx-auto max-w-5xl px-5 py-10 sm:px-8 sm:py-14">
  <a href="/customer/orders" class="text-sm font-semibold text-emerald-800 hover:underline">← Order history</a>
  <p id="order-error" class="mt-6 rounded-xl bg-red-50 px-4 py-3 text-sm text-red-800" role="alert" hidden></p>
  <div id="order-content" class="mt-7 space-y-6" hidden>
    <section class="rounded-3xl bg-emerald-950 p-6 text-white sm:p-8"><p class="text-xs font-bold uppercase tracking-[0.14em] text-emerald-200">Order details</p><div class="mt-3 flex flex-wrap items-start justify-between gap-4"><div><h1 id="order-title" class="text-3xl font-semibold"></h1><p id="order-date" class="mt-2 text-sm text-emerald-100"></p></div><span id="order-status" class="rounded-full bg-white/10 px-4 py-2 text-sm font-bold capitalize"></span></div><div class="mt-7 grid gap-4 border-t border-emerald-800 pt-5 sm:grid-cols-2"><div><p class="text-xs font-bold uppercase tracking-wider text-emerald-200">Vendor</p><p id="vendor-name" class="mt-1 font-semibold"></p></div><div><p class="text-xs font-bold uppercase tracking-wider text-emerald-200">Delivery address</p><p id="delivery-address" class="mt-1 font-semibold"></p></div></div></section>
    <section class="rounded-3xl border border-stone-200 bg-white p-6 shadow-sm sm:p-8"><h2 class="text-xl font-semibold">Items</h2><div id="order-items" class="mt-4 divide-y divide-stone-100"></div><div class="mt-5 flex justify-between border-t border-stone-200 pt-5"><span class="font-semibold">Order total</span><span id="order-total" class="font-bold"></span></div></section>
    <section id="payment-panel" class="rounded-3xl border border-stone-200 bg-white p-6 shadow-sm sm:p-8" hidden><h2 class="text-xl font-semibold">Pay with M-Pesa</h2><p id="payment-status" class="mt-2 text-sm leading-6 text-stone-600"></p><div id="payment-form" class="mt-5 flex flex-col gap-3 sm:flex-row sm:items-end"><label class="flex-1 text-sm font-semibold" for="mpesa-phone">M-Pesa phone number<input id="mpesa-phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="0712 345 678" class="mt-2 w-full rounded-xl border border-stone-300 bg-white px-3 py-3 text-sm font-normal" required></label><button id="mpesa-pay" type="button" class="rounded-full bg-emerald-800 px-5 py-3 text-sm font-bold text-white hover:bg-emerald-900 disabled:opacity-50">Send payment prompt</button></div><p id="payment-error" class="mt-4 rounded-xl bg-red-50 px-4 py-3 text-sm text-red-800" role="alert" hidden></p></section>
    <section class="rounded-3xl border border-stone-200 bg-white p-6 shadow-sm sm:p-8"><h2 class="text-xl font-semibold">Delivery tracking</h2><p id="tracking-message" class="mt-2 text-sm leading-6 text-stone-600"></p><ol id="tracking-steps" class="mt-6 grid gap-3 sm:grid-cols-4"></ol></section>
  </div>
</main>
</body>
</html>
