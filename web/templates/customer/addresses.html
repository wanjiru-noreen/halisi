<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Delivery addresses · HALISI</title>
  <link rel="stylesheet" href="/static/css/auth.css">
  <script src="/static/js/addresses.js" defer></script>
</head>
<body class="min-h-screen bg-stone-50 text-stone-900 antialiased" data-page="addresses">
<header class="border-b border-stone-200 bg-white"><nav class="mx-auto flex max-w-7xl items-center justify-between px-5 py-4 sm:px-8" aria-label="Account navigation"><a href="/" class="text-xl font-black tracking-[0.18em] text-emerald-900">HALISI<span class="text-orange-500">.</span></a><div class="flex gap-3"><a href="/customer/dashboard" class="rounded-full px-4 py-2 text-sm font-semibold text-emerald-800 hover:bg-emerald-50">My account</a><a href="/customer/cart" class="rounded-full px-4 py-2 text-sm font-semibold text-emerald-800 hover:bg-emerald-50">Cart</a></div></nav></header>
<main class="mx-auto max-w-7xl px-5 py-10 sm:px-8 sm:py-14">
  <a href="/customer/dashboard" class="text-sm font-semibold text-emerald-800 hover:underline">← Dashboard</a>
  <section class="mt-7 grid gap-7 lg:grid-cols-[1fr_22rem] lg:items-start">
    <div><p class="text-xs font-bold uppercase tracking-[0.14em] text-emerald-700">Delivery details</p><h1 class="mt-2 text-3xl font-semibold">Your addresses</h1><p class="mt-3 max-w-xl text-sm leading-6 text-stone-600">Save the places where you receive deliveries. Your addresses are private to your account.</p>
      <p id="address-error" class="mt-5 rounded-xl bg-red-50 px-4 py-3 text-sm text-red-800" role="alert" hidden></p>
      <div id="address-list" class="mt-6 grid gap-4 sm:grid-cols-2"></div>
      <div id="address-empty" class="mt-6 rounded-2xl border border-dashed border-stone-300 bg-white p-8 text-sm text-stone-600" hidden>You have not saved an address yet. Add one to make checkout quicker.</div>
    </div>
    <form id="address-form" class="rounded-3xl border border-stone-200 bg-white p-6 shadow-sm sm:p-7">
      <p id="form-eyebrow" class="text-xs font-bold uppercase tracking-[0.14em] text-emerald-700">New delivery address</p>
      <h2 id="form-title" class="mt-2 text-xl font-semibold">Add an address</h2>
      <label class="mt-5 block text-sm font-semibold" for="label">Label</label><input id="label" name="label" class="field mt-2" maxlength="100" placeholder="Home">
      <label class="mt-4 block text-sm font-semibold" for="address_line">Street address</label><textarea id="address_line" name="address_line" class="field mt-2 min-h-24 resize-y" maxlength="500" required></textarea>
      <label class="mt-4 block text-sm font-semibold" for="city">City or area</label><input id="city" name="city" class="field mt-2" maxlength="100" required>
      <p id="form-error" class="mt-4 text-sm text-red-700" role="alert" hidden></p>
      <button id="save-address" class="mt-6 w-full rounded-full bg-emerald-800 px-5 py-3 text-sm font-bold text-white hover:bg-emerald-900 disabled:opacity-50" type="submit">Save address</button>
      <button id="cancel-edit" class="mt-3 hidden w-full rounded-full border border-stone-300 px-5 py-3 text-sm font-semibold hover:bg-stone-50" type="button">Cancel edit</button>
    </form>
  </section>
</main>
</body>
</html>
