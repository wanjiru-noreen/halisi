<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Order history · HALISI</title>
  <link rel="stylesheet" href="/static/css/auth.css">
  <script src="/static/js/orders.js" defer></script>
</head>
<body class="min-h-screen bg-stone-50 text-stone-900 antialiased">
<header class="border-b border-stone-200 bg-white"><nav class="mx-auto flex max-w-7xl items-center justify-between px-5 py-4 sm:px-8" aria-label="Account navigation"><a href="/" class="text-xl font-black tracking-[0.18em] text-emerald-900">HALISI<span class="text-orange-500">.</span></a><div class="flex gap-3"><a href="/customer/dashboard" class="rounded-full px-4 py-2 text-sm font-semibold text-emerald-800 hover:bg-emerald-50">My account</a><a href="/customer/vendors" class="rounded-full px-4 py-2 text-sm font-semibold text-emerald-800 hover:bg-emerald-50">Shop</a></div></nav></header>
<main class="mx-auto max-w-5xl px-5 py-10 sm:px-8 sm:py-14">
  <a href="/customer/dashboard" class="text-sm font-semibold text-emerald-800 hover:underline">← Dashboard</a>
  <section class="mt-7"><p class="text-xs font-bold uppercase tracking-[0.14em] text-emerald-700">Your purchases</p><h1 class="mt-2 text-3xl font-semibold">Order history</h1><p class="mt-3 text-sm text-stone-600">Review past orders and follow delivery progress.</p></section>
  <p id="orders-error" class="mt-5 rounded-xl bg-red-50 px-4 py-3 text-sm text-red-800" role="alert" hidden></p>
  <div id="orders-list" class="mt-7 space-y-4" aria-live="polite"><p class="text-sm text-stone-500">Loading order history…</p></div>
  <div id="orders-empty" class="mt-7 rounded-3xl border border-dashed border-stone-300 bg-white p-9 text-center" hidden><h2 class="text-xl font-semibold">No orders yet</h2><p class="mt-2 text-sm text-stone-600">When you place an order, you can follow it here.</p><a href="/customer/vendors" class="mt-5 inline-flex rounded-full bg-emerald-800 px-5 py-3 text-sm font-bold text-white hover:bg-emerald-900">Find a vendor</a></div>
</main>
</body>
</html>
