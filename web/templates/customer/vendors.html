<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Search trusted HALISI cooking gas vendors by shop name or area.">
  <title>Find a vendor · HALISI</title>
  <link rel="stylesheet" href="/static/css/auth.css">
  <script src="/static/js/vendors.js" defer></script>
</head>
<body class="min-h-screen bg-stone-50 text-stone-900 antialiased">
<header class="border-b border-stone-200 bg-white"><nav class="mx-auto flex max-w-7xl items-center justify-between px-5 py-4 sm:px-8" aria-label="Main navigation"><a href="/" class="text-xl font-black tracking-[0.18em] text-emerald-900">HALISI<span class="text-orange-500">.</span></a><div class="flex gap-3"><a href="/customer/dashboard" class="rounded-full px-4 py-2 text-sm font-semibold text-emerald-800 hover:bg-emerald-50">My account</a><a href="/customer/cart" class="rounded-full px-4 py-2 text-sm font-semibold text-emerald-800 hover:bg-emerald-50">Cart</a></div></nav></header>
<main class="mx-auto max-w-7xl px-5 py-10 sm:px-8 sm:py-14">
  <a href="/" class="text-sm font-semibold text-emerald-800 hover:underline">← Home</a>
  <section class="mt-7 rounded-3xl bg-emerald-950 px-6 py-10 text-white sm:px-10 sm:py-12">
    <p class="text-xs font-bold uppercase tracking-[0.16em] text-emerald-200">Local and verified</p>
    <h1 class="mt-3 text-3xl font-semibold tracking-tight sm:text-4xl">Find a trusted gas vendor</h1>
    <p class="mt-3 max-w-2xl text-sm leading-6 text-emerald-100 sm:text-base">Search by shop name or delivery area to find approved suppliers and see which shops have products available.</p>
    <form id="vendor-search" class="mt-7 flex max-w-2xl flex-col gap-3 sm:flex-row">
      <label class="sr-only" for="vendor-query">Vendor name or area</label>
      <input id="vendor-query" name="q" class="min-w-0 flex-1 rounded-full border border-white/30 bg-white px-5 py-3 text-sm text-stone-900 outline-none focus:ring-2 focus:ring-orange-300" type="search" maxlength="100" placeholder="Try a shop name or area">
      <button class="rounded-full bg-orange-400 px-6 py-3 text-sm font-bold text-emerald-950 hover:bg-orange-300" type="submit">Search vendors</button>
    </form>
  </section>
  <section class="mt-10">
    <div class="flex flex-wrap items-end justify-between gap-3"><div><p class="text-xs font-bold uppercase tracking-[0.14em] text-emerald-700">Explore HALISI</p><h2 class="mt-2 text-2xl font-semibold">Available vendors</h2></div><p id="result-count" class="text-sm text-stone-500" aria-live="polite"></p></div>
    <p id="vendor-error" class="mt-5 rounded-xl bg-red-50 px-4 py-3 text-sm text-red-800" role="alert" hidden></p>
    <div id="vendor-results" class="mt-6 grid gap-5 sm:grid-cols-2 lg:grid-cols-3" aria-live="polite"><p class="text-sm text-stone-500">Loading vendors…</p></div>
  </section>
</main>
</body>
</html>
