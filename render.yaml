# Render Blueprint specification for Halisi production service.
# Provisioning requires an explicit Render blueprint deployment or service connection.
databases:
  - name: halisi-postgres
    databaseName: halisi
    user: halisi
    plan: 0.5c-1g
    region: oregon
    postgresMajorVersion: "17"
    ipAllowList: []

services:
  - type: web
    name: halisi
    runtime: go
    plan: starter
    region: oregon
    branch: main
    autoDeploy: false
    # Custom domains configured in Render Dashboard or uncomment after DNS is pointed:
    # domains:
    #   - halisi.co.ke
    #   - www.halisi.co.ke
    buildCommand: go build -o bin/server ./cmd/server && go build -o bin/migrate ./cmd/migrate
    preDeployCommand: ./bin/migrate up
    startCommand: ./bin/server
    healthCheckPath: /health
    disk:
      name: vendor-documents
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: APP_ENV
        value: production
      - key: VENDOR_DOCUMENT_DIR
        value: /var/data/vendor-documents
      - key: DATABASE_URL
        fromDatabase:
          name: halisi-postgres
          property: connectionString
      - key: PUBLIC_BASE_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_TLS_MODE
        value: starttls
      - key: SMTP_FROM
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      # Optional Google OAuth credentials; set in Render dashboard when enabled.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Optional M-Pesa Daraja STK Push credentials; set in Render dashboard when enabled.
      - key: MPESA_ENV
        sync: false
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_SHORT_CODE
        sync: false
      - key: MPESA_PASSKEY
        sync: false
      - key: MPESA_TRANSACTION_TYPE
        sync: false
